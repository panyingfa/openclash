# ==================== 节点筛选组 ====================
#新加坡节点
custom_proxy_group=新加坡节点`url-test`(?=.*(新加坡))^((?!(专线|海外用户)).)*$`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200
#日本节点
custom_proxy_group=日本节点`url-test`(?=.*(日本))^((?!(专线|海外用户)).)*$`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200
#台湾节点
custom_proxy_group=台湾节点`url-test`(?=.*(台湾|西亚))^((?!(专线|海外用户)).)*$`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200
#美国节点
custom_proxy_group=美国节点`url-test`(?=.*(美国))^((?!(专线|海外用户)).)*$`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200
# 其它节点
custom_proxy_group=其它节点`url-test`^(?!.*(香港|新加坡|日本|台湾|西亚|美国)).*$`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200

# 非香港霸天节点
custom_proxy_group=♻️ 非香港霸天`url-test`^(?!.*香港).*$`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200
# 香港霸天节点
custom_proxy_group=♻️ 香港霸天`url-test`(?=.*(香港))^((?!(专线|海外用户)).)*$`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200

# 自动选择节点组（整合各个地区节点）
custom_proxy_group=♻️ 自动选择`fallback`[]♻️ 香港霸天`[]新加坡节点`[]日本节点`[]台湾节点`[]美国节点`[]其它节点`https://www.gstatic.com/generate_204|https://cp.cloudflare.com`60,5,200

;启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true

